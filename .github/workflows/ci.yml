name: ci

# The merge gate. Every step below is also a target in the Makefile, and the
# two are meant to be diffed:
#
#   ci.yml "flutter version pin"      == make check-flutter
#   ci.yml "dart format"              == make gate-format
#   ci.yml "flutter pub get"          == make deps
#   ci.yml "flutter analyze"          == make gate-analyze
#   ci.yml "onnxruntime for macOS"    == make ort-macos      (gate-test's prerequisite)
#   ci.yml "model graphs"             == make models         (gate-test's prerequisite)
#   ci.yml "flutter test"             == make gate-test
#   ci.yml "gate mutation proof"      == make gate-proof
#   ci.yml "flutter build ios (...)"  == make gate-build-ios
#
# Whole tree, no baseline, from commit one (PLAN.md section 4.1).
#
# Actions are pinned to full commit SHAs (the tag in the comment is what the
# SHA was resolved from); a tag can be moved, a SHA cannot. Bump by resolving
# the new tag: gh api repos/<owner>/<repo>/git/ref/tags/<tag>.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR branches: one run per ref, superseded pushes cancelled. main is NEVER
# cancelled: a cancelled run is not a failed run, so nothing alerts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # macOS because this is an iOS-only app (D4) and the gate builds for iOS.
    # macos-26, not -15: the translation plugin (WP6c) calls
    # TranslationSession(installedSource:target:), which exists only in the
    # iOS 26 SDK, i.e. Xcode 26+; the macos-15 image's Xcode cannot compile it.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The token is not needed after the checkout (nothing here pushes
          # or calls the API) and must not sit in .git/config for later steps.
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # The ONE pin: app/pubspec.yaml environment.flutter, the line the
          # Makefile reads too. Nothing in this file restates the number.
          flutter-version-file: app/pubspec.yaml
          channel: stable
          cache: true

      - name: flutter version pin
        # The action installs what it is told, but the assertion is what makes
        # a pin a pin: if the action's resolution ever drifts, this fails
        # instead of gating against a different Flutter.
        run: |
          set -eo pipefail
          want=$(sed -n 's/^ *flutter: *"\{0,1\}\([0-9][0-9.]*\)"\{0,1\} *$/\1/p' app/pubspec.yaml)
          if [ -z "$want" ]; then
            echo "::error::No Flutter pin found in app/pubspec.yaml (environment.flutter)"
            exit 1
          fi
          have=$(flutter --version --machine 2>/dev/null | sed -n 's/.*"frameworkVersion": *"\([^"]*\)".*/\1/p')
          if [ "$have" != "$want" ]; then
            echo "::error::Flutter $have on the runner, but the gate is pinned to $want"
            exit 1
          fi
          echo "flutter $have"

      - name: dart format --set-exit-if-changed (whole tree)
        run: dart format --output=none --set-exit-if-changed .

      - name: flutter pub get (app, app/packages/ort_ffi, app/packages/translation_ios)
        # == make deps. All three pub packages must be resolved or the analyzer
        # sees unresolved imports in the packages and fails.
        run: |
          set -eo pipefail
          (cd app && flutter pub get)
          (cd app/packages/ort_ffi && flutter pub get)
          (cd app/packages/translation_ios && flutter pub get)

      - name: flutter analyze --fatal-infos
        run: cd app && flutter analyze --fatal-infos

      - name: onnxruntime for macOS (make ort-macos)
        # The package tests load the real runtime. The archive URL and its
        # sha256 are pinned ONCE, in the Makefile, so this step calls make
        # (as the proof step does) instead of restating the hash.
        run: make ort-macos

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        # `make models` creates wp0/.venv with uv (Python 3.14 and
        # wp0/requirements.lock.txt); the app's golden tests run the graphs it
        # builds. The build downloads the manga-ocr and comic-text-detector
        # weights once (see .claude/wp2/NOTES.md D2.19 for what the first CI
        # run must verify).

      - name: model graphs (make models)
        run: make models

      - name: flutter test
        run: |
          set -eo pipefail
          (cd app && flutter test)
          (cd app/packages/ort_ffi && flutter test)
          (cd app/packages/translation_ios && flutter test)

      - name: gate mutation proof (tool/gate_proof.sh)
        # The same script `make gate-proof` runs. It calls `make gate-format`,
        # `gate-analyze` and `gate-test` on a mutated tree, so it needs the
        # Makefile (and make, which the macOS runner has).
        run: bash tool/gate_proof.sh

      - name: flutter build ios (simulator debug, device release, unsigned)
        # The first native dependency (onnxruntime-c) brings the iOS build into
        # the gate; after each build nm proves the ORT entry point dart:ffi
        # looks up is in the app binary, the release one after Xcode's strip.
        # Same commands as make gate-build-ios.
        run: |
          set -eo pipefail
          (cd app && LANG=en_US.UTF-8 flutter build ios --simulator --no-codesign)
          find app/build/ios/iphonesimulator/Runner.app -maxdepth 1 -type f -name 'Runner*' -exec nm -gU {} + | grep -F " T _OrtGetApiBase" >/dev/null
          echo "OrtGetApiBase linked (simulator, debug)"
          (cd app && LANG=en_US.UTF-8 flutter build ios --release --no-codesign)
          find app/build/ios/iphoneos/Runner.app -maxdepth 1 -type f -name 'Runner*' -exec nm -gU {} + | grep -F " T _OrtGetApiBase" >/dev/null
          echo "OrtGetApiBase linked (device, release)"

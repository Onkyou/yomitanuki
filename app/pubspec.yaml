name: yomitanuki
description: "Reads physical manga: live bubble detection, on-device OCR, dictionary lookup, Anki export."
publish_to: 'none'

# CFBundleShortVersionString+CFBundleVersion on iOS.
version: 1.0.0+1

environment:
  sdk: ^3.13.2
  # THE Flutter pin. Makefile (check-flutter) and ci.yml (flutter-version-file +
  # its pin step) both read this line; nothing restates the number.
  flutter: "3.47.2"

dependencies:
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  ort_ffi:
    path: packages/ort_ffi
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    # The ONNX graphs and the vocabulary (D6, gitignored; `make models` builds
    # them, a .gitkeep keeps the directory). ORT reads files, so the app copies
    # them out of the bundle once (lib/data/services/ort/model_assets.dart).
    - assets/models/

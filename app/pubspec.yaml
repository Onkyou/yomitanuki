name: yomitanuki
description: "Reads physical manga: live bubble detection, on-device OCR, dictionary lookup, Anki export."
publish_to: 'none'

# CFBundleShortVersionString+CFBundleVersion on iOS.
version: 1.0.0+1

environment:
  sdk: ^3.13.2
  # THE Flutter pin. Makefile (check-flutter) and ci.yml (flutter-version-file +
  # its pin step) both read this line; nothing restates the number.
  flutter: "3.47.2"

dependencies:
  camera: ^0.12.1
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  image_picker: ^1.2.4
  ort_ffi:
    path: packages/ort_ffi
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  sqlite3: ^3.7.0
  translation_ios:
    path: packages/translation_ios
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  # dictionary.sqlite + dictionary.version are written by `make dict` and
  # gitignored; the directory is declared (and kept by .gitkeep) so a build
  # without them still bundles. The ONNX graphs and the vocabulary likewise
  # (D6, `make models`, kept by a .gitkeep); ORT reads files, so the app copies
  # them out of the bundle once (lib/data/services/ort/model_assets.dart).
  assets:
    - assets/dict/
    - assets/models/
